<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarnivalShowcase</title>
    <link rel="icon" href="/favicon.svg?v=20260423" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg?v=20260423" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=20260423" />
  </head>
  <body>
    <div class="app-shell">
      <section id="screen-direct-link" class="screen active screen-link">
        <div class="screen-hud hud-top">
          <div class="brand-lockup">
            <img class="brand-lockup-logo" src="/assets/carnivalstories-logo.svg?v=20260423" alt="Carnival Stories" />
          </div>
        </div>

        <div class="link-stage">
          <form id="direct-link-form" class="link-form direct-link-form">
            <input
              id="direct-link-input"
              name="direct-link-input"
              type="url"
              placeholder="PASTE YOUR GOOGLE DRIVE LINK HERE"
              required
            />
          </form>
          <p class="link-instruction">
            Put your google drive Link here
          </p>
          <div id="direct-status" class="status-line"></div>
        </div>
      </section>

      <section id="screen-gallery" class="screen workspace-screen gallery-screen">
        <div class="workspace-main">
          <div id="direct-loading-indicator" class="loading-indicator hidden" aria-live="polite">
            <span id="direct-loading-percent" class="loading-percent">0%</span>
            <span id="direct-loading-message" class="loading-message">Opening your gallery vault.</span>
          </div>

          <div id="gallery-error-state" class="gallery-error-state hidden" aria-live="polite">
            <img class="gallery-error-logo" src="/assets/carnivalstories-logo.svg?v=20260423" alt="Carnival Stories" />
            <p id="gallery-error-message" class="gallery-error-message">THIS FOLDER DOESN&apos;T HAVE ANY PHOTOS YET.</p>
          </div>

          <div class="workspace-stage">
            <div id="cover-photo" class="cover-photo">
              <a href="/" class="cover-logo-link" aria-label="Go to home page">
                <img class="cover-logo" src="/assets/carnivalstories-logo.svg?v=20260423" alt="Carnival Stories" />
              </a>
              <div class="empty-sequence">Your photos will show up here shortly.</div>
              <button id="toggle-gallery-settings" type="button" class="icon-action gallery-settings-button cover-settings-button" aria-label="Open slideshow settings">
                <span class="gallery-settings-text">Slideshow settings</span>
              </button>
            </div>

            <div class="folder-tabs-shell">
              <div id="folder-tabs" class="folder-tabs" aria-label="Folders"></div>
            </div>

            <div id="gallery" class="gallery-grid">
              <div class="empty-sequence">This folder doesn&apos;t have any photos yet.</div>
            </div>
          </div>

        </div>

        <aside class="workspace-side">
          <div class="side-panel">
            <div class="slideshow-settings-head">
              <img class="panel-favicon" src="/favicon.svg?v=20260423" alt="Carnival Stories" />
              <button id="close-gallery-settings" type="button" class="icon-action icon-action-close-panel" aria-label="Close slideshow settings">
                CLOSE
              </button>
            </div>
            <p class="side-subtitle">SLIDESHOW SETUP</p>

            <div class="side-group">
              <div class="side-row">
                <span class="side-key">Duration</span>
                <span id="duration-readout" class="side-value">4.0s</span>
              </div>
              <div class="counter-control">
                <button id="duration-decrease" type="button" class="counter-button" aria-label="Decrease duration">-</button>
                <div id="duration-count" class="counter-value" aria-live="polite">4s</div>
                <button id="duration-increase" type="button" class="counter-button" aria-label="Increase duration">+</button>
              </div>
            </div>

            <label class="toggle-row">
              <span class="side-key">Loop Slideshow</span>
              <input id="loop-input" type="checkbox" />
            </label>

            <button id="start-slideshow" type="button" class="primary-cta">
              Start Slideshow
            </button>
          </div>
        </aside>
      </section>
    </div>

    <div id="slideshow" class="slideshow hidden" aria-hidden="true">
      <div class="slideshow-frame">
        <div id="slideshow-toast" class="slideshow-toast" aria-live="polite">
          Use arrow keys to go through photos
        </div>
        <div class="slideshow-actions" aria-label="Photo actions">
          <button id="share-slide" type="button" class="slideshow-action slideshow-action-share" aria-label="Share photo">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="slideshow-action-icon">
              <path d="M16 8a3 3 0 1 0-2.83-4H13a3 3 0 0 0 .17 1L8.91 8.25A3 3 0 0 0 6 7a3 3 0 1 0 2.83 4h.17a3 3 0 0 0-.17-1l4.26-3.25A3 3 0 0 0 16 8Zm-10 1a1 1 0 1 1 1-1 1 1 0 0 1-1 1Zm10-5a1 1 0 1 1-1 1 1 1 0 0 1 1-1ZM6 17a1 1 0 1 1 1 1 1 1 0 0 1-1-1Zm10-5a3 3 0 0 0-2.09.84l-4.26-3.25a3 3 0 0 0 .17-1h-.17A3 3 0 1 0 6 14a3 3 0 0 0 2.83-2h.17a3 3 0 0 0-.17-1l4.26 3.25A3 3 0 1 0 16 12Zm0 5a1 1 0 1 1 1-1 1 1 0 0 1-1 1Z"/>
            </svg>
          </button>
          <button id="download-slide" type="button" class="slideshow-action" aria-label="Download photo">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="slideshow-action-icon">
              <path d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1Zm-6 15a1 1 0 0 1 1 1v1h10v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Zm0 0a1 1 0 0 1 1 1v1h10v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"/>
            </svg>
          </button>
        </div>
        <button id="prev-slide" type="button" class="slideshow-nav slideshow-nav-prev" aria-label="Previous photo">←</button>
        <img id="slide-image" class="slide-image" alt="" />
        <img id="slide-image-full" class="slide-image slide-image-full" alt="" />
        <video id="slide-video" class="slide-video hidden" playsinline preload="metadata" aria-label="Video slide"></video>
        <button id="slide-video-overlay" type="button" class="slide-video-overlay hidden" aria-label="Play video">
          <span class="slide-video-play-icon" aria-hidden="true"></span>
        </button>
        <div id="slide-video-controls" class="slide-video-controls hidden" aria-label="Video controls">
          <button id="slide-video-toggle" type="button" class="slide-video-toggle" aria-label="Play video">
            <span id="slide-video-toggle-icon" class="slide-video-toggle-icon is-play" aria-hidden="true"></span>
          </button>
          <div class="slide-video-timeline" aria-hidden="true">
            <div id="slide-video-progress" class="slide-video-progress"></div>
          </div>
        </div>
        <div id="slideshow-loader" class="slideshow-loader hidden" aria-hidden="true"></div>
        <button id="next-slide" type="button" class="slideshow-nav slideshow-nav-next" aria-label="Next photo">→</button>
      </div>
    </div>

    <script src="/qr.js?v=20260423"></script>
    <script src="/app.js?v=20260423"></script>
  </body>
</html>
