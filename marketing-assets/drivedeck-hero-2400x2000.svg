<svg width="2400" height="2000" viewBox="0 0 2400 2000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="260" y1="190" x2="2170" y2="1810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1A1B24"/>
      <stop offset="0.48" stop-color="#101115"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1810 360) rotate(136) scale(520 470)">
      <stop stop-color="#FF5A4C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FF5A4C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBottom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(510 1620) rotate(16) scale(680 470)">
      <stop stop-color="#6FE2D8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6FE2D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="1236" y1="473" x2="2022" y2="1167" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243434"/>
      <stop offset="0.33" stop-color="#5B7D75"/>
      <stop offset="0.66" stop-color="#D99574"/>
      <stop offset="1" stop-color="#5F2332"/>
    </linearGradient>
    <linearGradient id="phone" x1="1602" y1="1087" x2="1965" y2="1648" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17181D"/>
      <stop offset="1" stop-color="#0D0E13"/>
    </linearGradient>
    <filter id="tvShadow" x="1070" y="356" width="1098" height="705" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#000000" flood-opacity="0.44"/>
    </filter>
    <filter id="phoneShadow" x="1500" y="980" width="548" height="796" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
