  <rect width="2400" height="2000" rx="52" fill="url(#bg)"/>
  <rect width="2400" height="2000" rx="52" fill="url(#glowTop)"/>
  <rect width="2400" height="2000" rx="52" fill="url(#glowBottom)"/>

  <g opacity="0.95">
    <path d="M152 160C152 135.699 171.699 116 196 116H574C598.301 116 618 135.699 618 160V209C618 233.301 598.301 253 574 253H196C171.699 253 152 233.301 152 209V160Z" fill="#111217" fill-opacity="0.82" stroke="white" stroke-opacity="0.08"/>
    <text x="202" y="196" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">DriveDeck</text>
    <text x="204" y="236" fill="#A8ABB5" font-family="Arial, Helvetica, sans-serif" font-size="30" letter-spacing="3">TV SLIDESHOW EXPERIENCE</text>
  </g>

  <text x="150" y="495" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="800">Bring your Google Drive</text>
  <text x="150" y="651" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="800">photos and videos to</text>
  <text x="150" y="807" fill="#FF5A4C" font-family="Arial, Helvetica, sans-serif" font-size="168" font-weight="800">the biggest screen at home.</text>

  <text x="155" y="945" fill="#CACBD1" font-family="Arial, Helvetica, sans-serif" font-size="46">DriveDeck turns a plain Google Drive folder into a polished TV slideshow.</text>
  <text x="155" y="1008" fill="#CACBD1" font-family="Arial, Helvetica, sans-serif" font-size="46">Pair from your phone, open a folder, and let the room do the rest.</text>

  <g filter="url(#tvShadow)">
    <rect x="1120" y="398" width="998" height="587" rx="42" fill="#0B0C10"/>
    <rect x="1148" y="426" width="942" height="531" rx="28" fill="url(#screen)"/>
    <path d="M1190 869C1275 801 1357 763 1437 758C1525 752 1601 792 1690 793C1766 794 1839 765 1944 672C2012 611 2062 573 2090 559V957H1148V575C1211 623 1280 667 1354 710C1456 769 1541 777 1608 756C1676 734 1748 698 1845 697C1930 696 2011 728 2090 793V957H2010C1917 884 1836 849 1767 851C1699 853 1633 894 1545 913C1471 929 1391 930 1307 905C1266 893 1227 881 1190 869Z" fill="white" fill-opacity="0.16"/>
    <rect x="1188" y="466" width="190" height="42" rx="21" fill="#111217" fill-opacity="0.74"/>
    <text x="1222" y="494" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Slideshow</text>
    <rect x="1914" y="466" width="112" height="42" rx="21" fill="#111217" fill-opacity="0.74"/>
    <text x="1948" y="494" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">TV</text>
  </g>

  <g filter="url(#phoneShadow)">
    <rect x="1540" y="1020" width="468" height="716" rx="54" fill="#15161B"/>
    <rect x="1562" y="1042" width="424" height="672" rx="34" fill="url(#phone)"/>
    <text x="1606" y="1142" fill="#A8ABB5" font-family="Arial, Helvetica, sans-serif" font-size="32" letter-spacing="2.8">PAIRING CODE</text>
    <text x="1598" y="1366" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="188" font-weight="800">482193</text>
    <rect x="1606" y="1444" width="336" height="86" rx="43" fill="#F6F5F3"/>
    <text x="1708" y="1500" fill="#111217" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Create code</text>
    <text x="1608" y="1608" fill="#CACBD1" font-family="Arial, Helvetica, sans-serif" font-size="30">Enter this on your TV to continue</text>
  </g>

  <g opacity="0.92">
    <rect x="151" y="1428" width="1062" height="270" rx="40" fill="#111217" fill-opacity="0.72" stroke="white" stroke-opacity="0.06"/>
    <text x="206" y="1513" fill="#F6F5F3" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">Why it clicks</text>
    <text x="207" y="1591" fill="#C6C7CE" font-family="Arial, Helvetica, sans-serif" font-size="38">• Designed for TV remotes, not touchscreens</text>
    <text x="207" y="1654" fill="#C6C7CE" font-family="Arial, Helvetica, sans-serif" font-size="38">• Pairs quickly from a phone with a simple code</text>
    <text x="207" y="1717" fill="#C6C7CE" font-family="Arial, Helvetica, sans-serif" font-size="38">• Turns family memories into a shared room experience</text>
  </g>
